<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Fetch</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/favicon.png">
    
    <!-- NES.css -->
    <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet">
    
    <!-- Google Font for NES.css -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Custom styles -->
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    <!-- Custom Title Bar -->
    <div class="custom-title-bar" id="title-bar">
        <div class="title-bar-drag-area" id="drag-area">
            <span class="title-bar-title">♪ Audio Fetch</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-bar-button minimize-btn" id="minimize-btn" title="Minimize">
                <span>−</span>
            </button>
            <button class="title-bar-button close-btn" id="close-btn" title="Close">
                <span>×</span>
            </button>
        </div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">
                Audio Fetch
            </h1>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Initial State: URL Input Form -->
            <section id="input-section" class="nes-container with-title is-centered">
                <p class="title">Enter YouTube URL</p>
                
                <div class="input-group">
                    <input 
                        type="text" 
                        id="youtube-url" 
                        class="nes-input" 
                        placeholder="https://youtube.com/watch?v=..."
                    >
                    <button id="fetch-btn" class="nes-btn is-primary">Fetch Info</button>
                </div>
                
            </section>

            <!-- Loading State -->
            <section id="loading-section" class="nes-container is-centered" style="display: none;">
                <p>🔄 Loading info...</p>
                <div class="loading-spinner"></div>
            </section>

            <!-- Error State -->
            <section id="error-section" class="nes-container is-error" style="display: none;">
                <p class="error-title">❌ Error</p>
                <p id="error-message" class="error-detail"></p>
                <button id="retry-btn" class="nes-btn">Retry</button>
            </section>

            <!-- Video Info Display -->
            <section id="info-section" class="nes-container with-title" style="display: none;">
                <p class="title">Video Info</p>
                
                <div class="video-info-grid">
                    <!-- Thumbnail -->
                    <div class="thumbnail-container">
                        <img id="video-thumbnail" src="" alt="Video thumbnail" class="video-thumbnail">
                    </div>
                    
                    <!-- Metadata -->
                    <div class="video-metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Title:</span>
                            <span id="video-title" class="metadata-value"></span>
                        </div>
                        
                        <div class="metadata-item">
                            <span class="metadata-label">Channel:</span>
                            <span id="video-uploader" class="metadata-value"></span>
                        </div>
                        
                        <div class="metadata-item">
                            <span class="metadata-label">Duration:</span>
                            <span id="video-duration" class="metadata-value"></span>
                        </div>
                    </div>
                </div>

                <!-- Format and Quality Selection -->
                <div class="download-options">
                    <div class="option-group">
                        <label for="format-select">Format:</label>
                        <div class="nes-select">
                            <select id="format-select" required>
                                <option value="mp3" selected>MP3</option>
                                <option value="m4a">M4A</option>
                                <option value="opus">OPUS</option>
                                <option value="wav">WAV</option>
                                <option value="best">BEST</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="option-group">
                        <label for="quality-select">Quality:</label>
                        <div class="nes-select">
                            <select id="quality-select" required>
                                <option value="0" selected>Best</option>
                                <option value="5">Medium</option>
                                <option value="9">Low</option>
                            </select>
                        </div>
                    </div>
                </div>


                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button id="download-btn" class="nes-btn is-success">
                        Download
                    </button>
                    <button id="new-url-btn" class="nes-btn">New URL</button>
                </div>
            </section>
        </main>

        <!-- Footer -->

        <!-- Footer -->
        <footer class="footer">
            <p>
                ✨ From youngmarco with love 💙 ✨ | 
                <a href="https://github.com/youngmarco/audio-fetch" target="_blank" rel="noopener noreferrer" style="color: #209cee; text-decoration: none;">
                    📦 GitHub
                </a>
            </p>
        </footer>
    </div>


    <!-- Security Warning Dialog -->

    <!-- Scripts -->
    <script src="/static/js/audio.js"></script>
    <script src="/static/js/app.js"></script>
