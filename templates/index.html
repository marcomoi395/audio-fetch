<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Audio Fetch - 8-bit YouTube Downloader</title>
    
    <!-- NES.css -->
    <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet">
    
    <!-- Google Font for NES.css -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Custom styles -->
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">
                <i class="nes-icon is-large is-half heart"></i>
                Audio Fetch
                <i class="nes-icon is-large is-half heart"></i>
            </h1>
            <p class="subtitle">8-bit YouTube Audio Downloader</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Initial State: URL Input Form -->
            <section id="input-section" class="nes-container with-title is-centered">
                <p class="title">Nhập YouTube URL</p>
                
                <div class="input-group">
                    <input 
                        type="text" 
                        id="youtube-url" 
                        class="nes-input" 
                        placeholder="https://youtube.com/watch?v=..."
                        autocomplete="off"
                    >
                </div>
                
                <button id="fetch-btn" class="nes-btn is-primary">
                    Fetch Info
                </button>
            </section>

            <!-- Loading State -->
            <section id="loading-section" class="nes-container is-centered" style="display: none;">
                <p>🔄 Đang tải thông tin...</p>
                <div class="loading-spinner"></div>
            </section>

            <!-- Error State -->
            <section id="error-section" class="nes-container is-error" style="display: none;">
                <p class="error-title">❌ Lỗi</p>
                <p id="error-message" class="error-detail"></p>
                <button id="retry-btn" class="nes-btn">Thử lại</button>
            </section>

            <!-- Video Info Display -->
            <section id="info-section" class="nes-container with-title" style="display: none;">
                <p class="title">Thông tin Video</p>
                
                <div class="video-info-grid">
                    <!-- Thumbnail -->
                    <div class="thumbnail-container">
                        <img id="video-thumbnail" src="" alt="Video thumbnail" class="video-thumbnail">
                    </div>
                    
                    <!-- Metadata -->
                    <div class="video-metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Tiêu đề:</span>
                            <span id="video-title" class="metadata-value"></span>
                        </div>
                        
                        <div class="metadata-item">
                            <span class="metadata-label">Kênh:</span>
                            <span id="video-uploader" class="metadata-value"></span>
                        </div>
                        
                        <div class="metadata-item">
                            <span class="metadata-label">Thời lượng:</span>
                            <span id="video-duration" class="metadata-value"></span>
                        </div>
                    </div>
                </div>

                <!-- Format and Quality Selection -->
                <div class="download-options">
                    <div class="option-group">
                        <label for="format-select">Định dạng:</label>
                        <div class="nes-select">
                            <select id="format-select" required>
                                <option value="mp3" selected>MP3</option>
                                <option value="m4a">M4A</option>
                                <option value="opus">OPUS</option>
                                <option value="wav">WAV</option>
                                <option value="best">BEST</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="option-group">
                        <label for="quality-select">Chất lượng:</label>
                        <div class="nes-select">
                            <select id="quality-select" required>
                                <option value="0" selected>Cao nhất (320kbps)</option>
                                <option value="5">Trung bình (192kbps)</option>
                                <option value="9">Thấp (128kbps)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button id="download-btn" class="nes-btn is-success">
                        Download
                    </button>
                    <button id="new-url-btn" class="nes-btn">
                        URL mới
                    </button>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with <i class="nes-icon is-small heart"></i> for 8-bit lovers</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/static/js/audio.js"></script>
    <script src="/static/js/app.js"></script>
