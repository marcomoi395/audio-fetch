name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.1.0)'
        required: true
        type: string
      upload_to_release:
        description: 'Upload artifacts to release draft'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.1.0)'
        required: true
        type: string
      upload_to_release:
        description: 'Upload artifacts to release draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-linux:
    name: Build Linux AppImage and deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux artifacts
        run: bun run build:linux

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          retention-days: 7

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          retention-days: 7

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows artifact
        run: bun run build:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 7

  upload-to-release:
    name: Upload Electron artifacts to release draft
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: ${{ inputs.upload_to_release == true }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            artifacts/linux-appimage/*.AppImage \
            artifacts/linux-deb/*.deb \
            artifacts/windows-installer/*.exe \
            --repo "${{ github.repository }}"
