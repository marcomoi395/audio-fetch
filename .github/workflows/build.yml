name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.1.0)'
        required: true
        type: string
      upload_to_release:
        description: 'Upload artifacts to release draft'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.1.0)'
        required: true
        type: string
      upload_to_release:
        description: 'Upload artifacts to release draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Qt dependencies for PyInstaller
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb1 \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2
          # Install fpm for .deb and .rpm packaging
          sudo apt-get install -y ruby-dev
          sudo gem install fpm
          # Install appimagetool dependencies
          sudo apt-get install -y wget
      
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Build AppImage
        run: |
          ./scripts/build-linux-appimage.sh ${{ steps.version.outputs.version }}
      
      - name: Build .deb package
        run: |
          ./scripts/build-linux-deb.sh ${{ steps.version.outputs.version }}
      
      - name: Build .rpm package
        run: |
          ./scripts/build-linux-rpm.sh ${{ steps.version.outputs.version }}
      
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/audio-fetch-v${{ steps.version.outputs.version }}-x86_64.AppImage
          retention-days: 7
      
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/audio-fetch_${{ steps.version.outputs.version }}_amd64.deb
          retention-days: 7
      
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/audio-fetch-${{ steps.version.outputs.version }}-1.x86_64.rpm
          retention-days: 7

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      
      - name: Install Inno Setup
        run: |
          choco install innosetup -y
      
      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Build Windows Installer
        shell: bash
        run: |
          ./scripts/build-windows-installer.sh ${{ steps.version.outputs.version }}
      
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/audio-fetch-v${{ steps.version.outputs.version }}-setup.exe
          retention-days: 7

  upload-to-release:
    name: Upload to Release Draft
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: ${{ inputs.upload_to_release == true }}
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure of downloaded files
        run: ls -R artifacts
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Find release by tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ inputs.tag }} --jq '.id')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "Found release ID: $RELEASE_ID"
      
      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          
          # Upload AppImage
          gh release upload ${{ inputs.tag }} \
            artifacts/linux-appimage/audio-fetch-v${{ steps.version.outputs.version }}-x86_64.AppImage \
            --repo ${{ github.repository }}
          
          # Upload .deb
          gh release upload ${{ inputs.tag }} \
            artifacts/linux-deb/audio-fetch_${{ steps.version.outputs.version }}_amd64.deb \
            --repo ${{ github.repository }}
          
          # Upload .rpm
          gh release upload ${{ inputs.tag }} \
            artifacts/linux-rpm/audio-fetch-${{ steps.version.outputs.version }}-1.x86_64.rpm \
            --repo ${{ github.repository }}
          
          # Upload Windows installer
          gh release upload ${{ inputs.tag }} \
            artifacts/windows-installer/audio-fetch-v${{ steps.version.outputs.version }}-setup.exe \
            --repo ${{ github.repository }}
          
          echo "All artifacts uploaded successfully!"
