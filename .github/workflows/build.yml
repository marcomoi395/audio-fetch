name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.1.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate-inputs:
    name: Validate build inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$BUILD_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid build tag: $BUILD_TAG" >&2
            exit 1
          fi

  build-linux:
    needs: validate-inputs
    name: Build Linux AppImage and deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify source runtime resources
        run: bun run verify:resources

      - name: Build Linux artifacts
        run: bun run build:linux
      - name: Verify Linux artifacts
        run: |
          appimage=$(find dist -maxdepth 1 -type f -name '*.AppImage' -size +0c -print -quit)
          deb=$(find dist -maxdepth 1 -type f -name '*.deb' -size +0c -print -quit)
          test -n "$appimage" && test -n "$deb"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          retention-days: 7

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          retention-days: 7

  build-windows:
    needs: validate-inputs
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify source runtime resources
        run: bun run verify:resources

      - name: Build Windows artifact
        run: bun run build:win
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem dist/*.exe -File -ErrorAction Stop
          if (($artifacts | Where-Object Length -gt 0).Count -lt 1) { throw 'Windows installer empty' }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 7
