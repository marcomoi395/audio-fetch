name: Auto-merge Release PRs

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    name: Auto-merge release PR
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          echo "Enabling auto-merge for release PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --auto \
            --delete-branch || echo "Auto-merge not available, merge manually"

      - name: Summary
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"

          echo "## Auto-merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #$PR_NUMBER" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-merge**: Enabled ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[$PR_URL]($PR_URL)" >> $GITHUB_STEP_SUMMARY
