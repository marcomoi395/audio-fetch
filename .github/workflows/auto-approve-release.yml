name: Auto-approve Release PRs

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve:
    name: Auto-approve and merge release PR
    # Only run for PRs from release branches
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          
          echo "Auto-approving release PR #$PR_NUMBER"
          
          # Approve the PR
          gh pr review "$PR_NUMBER" \
            --repo "$REPO" \
            --approve \
            --body "✅ Auto-approved: Release PR with version bump only"
      
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          
          echo "Enabling auto-merge for PR #$PR_NUMBER"
          
          # Enable auto-merge (will merge when all checks pass)
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --auto \
            --delete-branch || echo "Auto-merge not available (branch protection may require reviews)"
      
      - name: Summary
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          
          echo "## Auto-approval Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #$PR_NUMBER" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Approved ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-merge**: Enabled (will merge automatically)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[$PR_URL]($PR_URL)" >> $GITHUB_STEP_SUMMARY
