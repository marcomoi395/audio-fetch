name: Post-Merge Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    name: Prepare Release
    # Only run if PR was merged and branch name starts with 'release/'
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.extract_version.outputs.new_tag }}
      previous_tag: ${{ steps.get_previous_tag.outputs.previous_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from branch name
        id: extract_version
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          NEW_TAG="${BRANCH_NAME#release/}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Extracted tag: $NEW_TAG from branch: $BRANCH_NAME"

      - name: Get previous tag
        id: get_previous_tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREVIOUS_TAG"

      - name: Create and push tag
        run: |
          NEW_TAG="${{ steps.extract_version.outputs.new_tag }}"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Warning: Tag $NEW_TAG already exists, skipping tag creation"
          else
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG"
            echo "Tag $NEW_TAG created and pushed"
          fi

      - name: Delete release branch
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          git push origin --delete "$BRANCH_NAME" || echo "Branch already deleted"

  build:
    name: Build Artifacts
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.prepare.outputs.new_tag }}
      upload_to_release: false

  publish:
    name: Publish Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG="${{ needs.prepare.outputs.previous_tag }}"
          NEW_TAG="${{ needs.prepare.outputs.new_tag }}"

          echo "Generating changelog from $PREVIOUS_TAG to $NEW_TAG"

          if [ "$PREVIOUS_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          CHANGELOG_FILE="/tmp/changelog.md"

          echo "## Changes in ${NEW_TAG}" > "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "$COMMITS" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${NEW_TAG}" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "---" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "## Installation" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "### Linux" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "**AppImage** (Universal):" >> "$CHANGELOG_FILE"
          echo '```bash' >> "$CHANGELOG_FILE"
          echo "chmod +x audio-fetch-${NEW_TAG}-x86_64.AppImage" >> "$CHANGELOG_FILE"
          echo "./audio-fetch-${NEW_TAG}-x86_64.AppImage" >> "$CHANGELOG_FILE"
          echo '```' >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "**Debian/Ubuntu** (.deb):" >> "$CHANGELOG_FILE"
          echo '```bash' >> "$CHANGELOG_FILE"
          echo "sudo dpkg -i audio-fetch_${NEW_TAG#v}_amd64.deb" >> "$CHANGELOG_FILE"
          echo '```' >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "**Fedora/RHEL/CentOS** (.rpm):" >> "$CHANGELOG_FILE"
          echo '```bash' >> "$CHANGELOG_FILE"
          echo "sudo rpm -i audio-fetch-${NEW_TAG#v}-1.x86_64.rpm" >> "$CHANGELOG_FILE"
          echo '```' >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "### Windows" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "Run the installer: \`audio-fetch-${NEW_TAG}-setup.exe\`" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "---" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "## Requirements" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "- **FFmpeg** is required for audio conversion" >> "$CHANGELOG_FILE"
          echo "  - Linux: \`sudo apt install ffmpeg\` or \`sudo dnf install ffmpeg\`" >> "$CHANGELOG_FILE"
          echo "  - Windows: Download from [ffmpeg.org](https://ffmpeg.org/download.html)" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "## Notes" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "- Automatic browser cookie extraction for YouTube authentication" >> "$CHANGELOG_FILE"
          echo "- Supports Chrome, Firefox, Edge, and Brave browsers" >> "$CHANGELOG_FILE"
          echo "- 3-tier download strategy for robust downloading" >> "$CHANGELOG_FILE"

          echo "changelog_file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="${{ needs.prepare.outputs.new_tag }}"
          VERSION="${NEW_TAG#v}"
          CHANGELOG_FILE="${{ steps.changelog.outputs.changelog_file }}"

          # Create release draft
          gh release create "$NEW_TAG" \
            --draft \
            --title "Release $NEW_TAG" \
            --notes-file "$CHANGELOG_FILE" \
            --repo ${{ github.repository }}

          # Upload artifacts
          gh release upload "$NEW_TAG" \
            artifacts/linux-appimage/audio-fetch-v${VERSION}-x86_64.AppImage \
            --repo ${{ github.repository }}

          gh release upload "$NEW_TAG" \
            artifacts/linux-deb/audio-fetch_${VERSION}_amd64.deb \
            --repo ${{ github.repository }}

          gh release upload "$NEW_TAG" \
            artifacts/linux-rpm/audio-fetch-${VERSION}-1.x86_64.rpm \
            --repo ${{ github.repository }}

          gh release upload "$NEW_TAG" \
            artifacts/windows-installer/audio-fetch-v${VERSION}-setup.exe \
            --repo ${{ github.repository }}

          echo "Release draft created with all artifacts: $NEW_TAG"

      - name: Summary
        run: |
          NEW_TAG="${{ needs.prepare.outputs.new_tag }}"

          echo "## Release Published Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: Created and pushed ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Completed ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: Draft created with artifacts ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the [release draft](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "2. Edit changelog if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Publish the release when ready" >> $GITHUB_STEP_SUMMARY
