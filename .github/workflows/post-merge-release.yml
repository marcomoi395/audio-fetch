name: Post-Merge Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  prepare-release:
    name: Prepare Electron release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.release.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify release commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Release commit mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA" >&2
            exit 1
          fi

      - name: Extract and validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NEW_TAG="$DISPATCH_VERSION"
          else
            case "$HEAD_REF" in
              release/*) NEW_TAG="${HEAD_REF#release/}" ;;
              *) echo "Unsupported release branch: $HEAD_REF" >&2; exit 1 ;;
            esac
          fi

          if [[ ! "$NEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $NEW_TAG" >&2
            exit 1
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.release.outputs.new_tag }}
        run: |
          EXPECTED_SHA=$(git rev-parse HEAD)
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$NEW_TAG^{commit}")
            if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
              echo "Tag $NEW_TAG points to $TAG_SHA, expected $EXPECTED_SHA" >&2
              exit 1
            fi
            echo "Tag $NEW_TAG already points to $EXPECTED_SHA"
          else
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG"
          fi

      - name: Get previous tag
        id: previous
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || echo "v0.0.0")
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: generate
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.previous_tag }}
          NEW_TAG: ${{ steps.release.outputs.new_tag }}
        run: |
          CHANGELOG_FILE="$RUNNER_TEMP/changelog.md"
          if [ "$PREVIOUS_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log "$PREVIOUS_TAG".."$GITHUB_SHA" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "## Changes in $NEW_TAG"
            echo
            echo "$COMMITS"
            echo
            echo "## Installation"
            echo
            echo "### Linux"
            echo
            echo "- AppImage"
            echo "- Debian package (.deb)"
            echo
            echo "### Windows"
            echo
            echo "- Windows installer (.exe)"
          } > "$CHANGELOG_FILE"

          echo "changelog_path=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload release changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: ${{ steps.generate.outputs.changelog_path }}

  build:
    name: Build Electron artifacts
    needs: prepare-release
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.prepare-release.outputs.new_tag }}
    permissions:
      contents: read
      actions: read

  publish:
    name: Publish Electron release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release draft and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          NEW_TAG: ${{ needs.prepare-release.outputs.new_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$NEW_TAG" \
            --draft \
            --title "Release $NEW_TAG" \
            --notes-file artifacts/release-changelog/changelog.md \
            --repo "$REPOSITORY"
          gh release upload "$NEW_TAG" \
            artifacts/linux-appimage/*.AppImage \
            artifacts/linux-deb/*.deb \
            artifacts/windows-installer/*.exe \
            --repo "$REPOSITORY"
