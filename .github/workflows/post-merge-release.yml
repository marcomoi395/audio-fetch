name: Post-Merge Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  publish-release:
    name: Publish Electron release
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract release tag
        id: extract_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEW_TAG="${{ inputs.version }}"
          else
            NEW_TAG="${{ github.event.pull_request.head.ref }}"
            NEW_TAG="${NEW_TAG#release/}"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Get previous tag
        id: get_previous_tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.extract_version.outputs.new_tag }}
        run: |
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists"
          else
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG"
          fi

      - name: Trigger build and wait
        id: build
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          NEW_TAG: ${{ steps.extract_version.outputs.new_tag }}
        run: |
          gh workflow run build.yml \
            -f tag="$NEW_TAG" \
            -f upload_to_release=false \
            --repo "${{ github.repository }}"
          sleep 10
          RUN_ID=$(gh run list \
            --workflow build.yml \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --repo "${{ github.repository }}" --exit-status

      - name: Generate changelog
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.get_previous_tag.outputs.previous_tag }}
          NEW_TAG: ${{ steps.extract_version.outputs.new_tag }}
        run: |
          CHANGELOG_FILE="$RUNNER_TEMP/changelog.md"
          if [ "$PREVIOUS_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "## Changes in $NEW_TAG"
            echo
            echo "$COMMITS"
            echo
            echo "## Installation"
            echo
            echo "### Linux"
            echo
            echo "- AppImage"
            echo "- Debian package (.deb)"
            echo
            echo "### Windows"
            echo
            echo "- Windows installer (.exe)"
          } > "$CHANGELOG_FILE"
          echo "changelog_file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          path: artifacts

      - name: Create release draft and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          NEW_TAG: ${{ steps.extract_version.outputs.new_tag }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.changelog_file }}
        run: |
          gh release create "$NEW_TAG" \
            --draft \
            --title "Release $NEW_TAG" \
            --notes-file "$CHANGELOG_FILE" \
            --repo "${{ github.repository }}"
          gh release upload "$NEW_TAG" \
            artifacts/linux-appimage/*.AppImage \
            artifacts/linux-deb/*.deb \
            artifacts/windows-installer/*.exe \
            --repo "${{ github.repository }}"
