name: CI

# Electron/Bun is the canonical CI; legacy Python checks remain local behavioral references during migration.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Bun and Electron checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun test

      - name: Coverage
        run: bun run test:coverage
      - name: Scoped coverage gates
        run: |
          bun run test:coverage:main
          bun run test:coverage:ipc
          bun run test:coverage:renderer
          bun run test:coverage:critical
      - name: Verify source runtime resources
        run: bun run verify:resources

      - name: Build unpacked Electron application
        run: bun run build:unpack

      - name: Verify unpacked runtime resources
        run: bun run verify:resources:unpacked

      - name: Headless Electron E2E
        run: xvfb-run bun run test:e2e
