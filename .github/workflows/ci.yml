name: CI

# Electron/Bun is the canonical CI; legacy Python checks remain local behavioral references during migration.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Bun and Electron checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun test

      - name: Coverage
        run: bun run test:coverage

      - name: Build Electron application
        run: bun run build
      - name: Headless Electron E2E
        run: xvfb-run bun run test:e2e
