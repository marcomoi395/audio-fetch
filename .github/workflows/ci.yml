name: CI

# Electron/Bun is the canonical CI; legacy Python checks remain local behavioral references during migration.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
permissions:
  contents: read

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f
        with:
          args: -color
  quality:
    name: Bun and Electron checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun test

      - name: Coverage
        run: bun run test:coverage
      - name: Scoped coverage gates
        run: |
          bun run test:coverage:main
          bun run test:coverage:ipc
          bun run test:coverage:renderer
          bun run test:coverage:critical
      - name: Verify source runtime resources
        run: bun run verify:resources

      - name: Build unpacked Electron application
        run: bun run build:unpack

      - name: Verify unpacked runtime resources
        run: bun run verify:resources:unpacked

      - name: Headless Electron E2E
        run: xvfb-run bun run test:e2e
