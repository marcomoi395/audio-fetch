name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Get the latest tag, default to v0.0.0 if no tags exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"
      
      - name: Calculate new version
        id: calc_version
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          BUMP_TYPE="${{ inputs.version_bump }}"
          
          # Strip 'v' prefix for calculation
          CURRENT_VERSION="${LATEST_TAG#v}"
          
          # Run bump-version script to calculate new version
          chmod +x scripts/bump-version.sh
          NEW_VERSION=$(./scripts/bump-version.sh "$CURRENT_VERSION" "$BUMP_TYPE")
          
          # Add 'v' prefix for tag
          NEW_TAG="v${NEW_VERSION}"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Bumping from $LATEST_TAG to $NEW_TAG ($BUMP_TYPE)"
      
      - name: Check if tag already exists
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Error: Tag $NEW_TAG already exists"
            exit 1
          fi
      
      - name: Update version in pyproject.toml
        run: |
          NEW_VERSION="${{ steps.calc_version.outputs.new_version }}"
          
          # Update version using sed
          sed -i "s/^version = \".*\"$/version = \"$NEW_VERSION\"/" pyproject.toml
          
          # Verify update
          if ! grep -q "version = \"$NEW_VERSION\"" pyproject.toml; then
            echo "Error: Failed to update version in pyproject.toml"
            exit 1
          fi
          
      - name: Create release branch and push
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          BRANCH_NAME="release/$NEW_TAG"
          
          # Create and switch to release branch
          git checkout -b "$BRANCH_NAME"
          
          # Commit version bump
          git add pyproject.toml
          git commit -m "chore: bump version to $NEW_TAG"
          
          # Push release branch
          git push origin "$BRANCH_NAME"
          
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Release branch $BRANCH_NAME created and pushed"
        id: create_branch
      
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          BRANCH_NAME="${{ steps.create_branch.outputs.branch_name }}"
          BUMP_TYPE="${{ inputs.version_bump }}"
          
          # Create PR body
          PR_BODY="## Release $NEW_TAG
          
          This PR bumps the version to **$NEW_TAG** ($BUMP_TYPE bump).
          
          ### Checklist
          - [ ] Version updated in pyproject.toml
          - [ ] Tests passing
          - [ ] Ready to merge and release
          
          After merging, the release workflow will automatically:
          1. Create git tag $NEW_TAG
          2. Generate changelog
          3. Create GitHub release draft
          4. Trigger build workflow
          
          ---
          
          **Note**: Do not merge until all checks pass and you're ready to publish the release."
          
          # Create PR
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Release $NEW_TAG" \
            --body "$PR_BODY" \
            --repo ${{ github.repository }})
          
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Pull request created: $PR_URL"
        id: create_pr
      
      
      - name: Summary
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          BUMP_TYPE="${{ inputs.version_bump }}"
          PR_URL="${{ steps.create_pr.outputs.pr_url }}"
          
          echo "## Release Preparation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type**: $BUMP_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Release PR created ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the [Pull Request]($PR_URL)" >> $GITHUB_STEP_SUMMARY
          echo "2. Wait for CI tests to pass" >> $GITHUB_STEP_SUMMARY
          echo "3. Merge the PR when ready" >> $GITHUB_STEP_SUMMARY
          echo "4. Release workflow will automatically create tag and publish release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$PR_URL" >> $GITHUB_STEP_SUMMARY
