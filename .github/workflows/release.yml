name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Get the latest tag, default to v0.0.0 if no tags exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"
      
      - name: Calculate new version
        id: calc_version
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          BUMP_TYPE="${{ inputs.version_bump }}"
          
          # Strip 'v' prefix for calculation
          CURRENT_VERSION="${LATEST_TAG#v}"
          
          # Run bump-version script to calculate new version
          chmod +x scripts/bump-version.sh
          NEW_VERSION=$(./scripts/bump-version.sh "$CURRENT_VERSION" "$BUMP_TYPE")
          
          # Add 'v' prefix for tag
          NEW_TAG="v${NEW_VERSION}"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Bumping from $LATEST_TAG to $NEW_TAG ($BUMP_TYPE)"
      
      - name: Check if tag already exists
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Error: Tag $NEW_TAG already exists"
            exit 1
          fi
      
      - name: Update version in pyproject.toml
        run: |
          NEW_VERSION="${{ steps.calc_version.outputs.new_version }}"
          
          # Update version using sed
          sed -i "s/^version = \".*\"$/version = \"$NEW_VERSION\"/" pyproject.toml
          
          # Verify update
          if ! grep -q "version = \"$NEW_VERSION\"" pyproject.toml; then
            echo "Error: Failed to update version in pyproject.toml"
            exit 1
          fi
          
          echo "Updated pyproject.toml to version $NEW_VERSION"
      
      - name: Commit version bump
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          
          git add pyproject.toml
          git commit -m "chore: bump version to $NEW_TAG"
          git push origin main
          
          echo "Version bump committed and pushed"
      
      - name: Create and push tag
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          
          echo "Tag $NEW_TAG created and pushed"
      
      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          
          echo "Generating changelog from $LATEST_TAG to $NEW_TAG"
          
          # Get commits between tags
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            # First release - get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since last tag
            COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Create changelog using heredoc
          CHANGELOG=$(cat <<'EOF'
## Changes in ${NEW_TAG}

${COMMITS}

**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${LATEST_TAG}...${NEW_TAG}

---

## Installation

### Linux

**AppImage** (Universal):
```bash
chmod +x audio-fetch-${NEW_TAG}-x86_64.AppImage
./audio-fetch-${NEW_TAG}-x86_64.AppImage
```

**Debian/Ubuntu** (.deb):
```bash
sudo dpkg -i audio-fetch_${NEW_VERSION}_amd64.deb
```

**Fedora/RHEL/CentOS** (.rpm):
```bash
sudo rpm -i audio-fetch-${NEW_VERSION}-1.x86_64.rpm
```

### Windows

Run the installer: `audio-fetch-${NEW_TAG}-setup.exe`

---

## Requirements

- **FFmpeg** is required for audio conversion
  - Linux: `sudo apt install ffmpeg` or `sudo dnf install ffmpeg`
  - Windows: Download from [ffmpeg.org](https://ffmpeg.org/download.html)

## Notes

- Automatic browser cookie extraction for YouTube authentication
- Supports Chrome, Firefox, Edge, and Brave browsers
- 3-tier download strategy for robust downloading
EOF
)
          
          # Substitute variables
          CHANGELOG="${CHANGELOG//\$\{NEW_TAG\}/$NEW_TAG}"
          CHANGELOG="${CHANGELOG//\$\{NEW_VERSION\}/${NEW_TAG#v}}"
          CHANGELOG="${CHANGELOG//\$\{COMMITS\}/$COMMITS}"
          CHANGELOG="${CHANGELOG//\$\{GITHUB_REPOSITORY\}/${{ github.repository }}}"
          CHANGELOG="${CHANGELOG//\$\{LATEST_TAG\}/$LATEST_TAG}"
          
          # Save changelog to file (for multi-line output)
          echo "$CHANGELOG" > /tmp/changelog.md
          echo "changelog_file=/tmp/changelog.md" >> $GITHUB_OUTPUT
          
          echo "Changelog generated"
      
      - name: Create release draft
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          CHANGELOG_FILE="${{ steps.changelog.outputs.changelog_file }}"
          
          # Create release draft
          gh release create "$NEW_TAG" \
            --draft \
            --title "Release $NEW_TAG" \
            --notes-file "$CHANGELOG_FILE" \
            --repo ${{ github.repository }}
          
          echo "Release draft created for $NEW_TAG"
      
      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          
          # Trigger build workflow
          gh workflow run build.yml \
            -f tag="$NEW_TAG" \
            -f upload_to_release=true \
            --repo ${{ github.repository }}
          
          echo "Build workflow triggered for $NEW_TAG"
          echo ""
          echo "Monitor build progress at:"
          echo "https://github.com/${{ github.repository }}/actions/workflows/build.yml"
      
      - name: Summary
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          BUMP_TYPE="${{ inputs.version_bump }}"
          
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type**: $BUMP_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Release draft created ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Triggered and running" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Wait for build workflow to complete" >> $GITHUB_STEP_SUMMARY
          echo "2. Review the [release draft](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "3. Edit changelog if needed" >> $GITHUB_STEP_SUMMARY
          echo "4. Publish the release when ready" >> $GITHUB_STEP_SUMMARY
