name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  release:
    name: Create Electron release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag
        id: get_latest_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: calc_version
        env:
          CURRENT_VERSION: ${{ steps.get_latest_tag.outputs.latest_tag }}
          BUMP_TYPE: ${{ inputs.version_bump }}
        run: |
          NEW_VERSION=$(bun -e '
            const current = process.env.CURRENT_VERSION.replace(/^v/, "").split(".").map(Number)
            if (current.length !== 3 || current.some(Number.isNaN)) process.exit(1)
            if (process.env.BUMP_TYPE === "major") current[0] += 1, current[1] = 0, current[2] = 0
            if (process.env.BUMP_TYPE === "minor") current[1] += 1, current[2] = 0
            if (process.env.BUMP_TYPE === "patch") current[2] += 1
            console.log(current.join("."))
          ')
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update package.json and bun.lock versions
        env:
          NEW_VERSION: ${{ steps.calc_version.outputs.new_version }}
        run: |
          NEW_VERSION="$NEW_VERSION" bun -e '
            const fs = require("node:fs")
            const path = "package.json"
            const packageJson = JSON.parse(fs.readFileSync(path, "utf8"))
            packageJson.version = process.env.NEW_VERSION
            fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`)
          '
          NEW_VERSION="$NEW_VERSION" bun -e '
            const packageJson = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"))
            if (packageJson.version !== process.env.NEW_VERSION) process.exit(1)
          '
          bun install --lockfile-only --ignore-scripts

      - name: Create release branch and push
        id: create_branch
        env:
          NEW_TAG: ${{ steps.calc_version.outputs.new_tag }}
        run: |
          BRANCH_NAME="release/$NEW_TAG"
          git fetch origin
          git checkout -b "$BRANCH_NAME"
          git add package.json bun.lock
          git commit -m "chore: bump version to $NEW_TAG"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          NEW_TAG: ${{ steps.calc_version.outputs.new_tag }}
          BRANCH_NAME: ${{ steps.create_branch.outputs.branch_name }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Release $NEW_TAG" \
            --body "Release $NEW_TAG. Electron artifacts: Windows installer, Linux AppImage, Linux deb." \
            --repo "${{ github.repository }}"
