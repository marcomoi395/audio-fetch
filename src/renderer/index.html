<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Audio Fetch</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>
  <body>
    <main id="app">
      <h1>Audio Fetch</h1>
      <form id="videoInfoForm">
        <label for="videoUrl">YouTube URL</label>
        <input id="videoUrl" name="videoUrl" type="url" required />
        <button id="fetchVideoInfo" type="submit">Fetch info</button>
      </form>
      <p id="videoInfoStatus" role="status">Ready</p>
      <section id="videoInfo" hidden>
        <h2 id="videoTitle"></h2>
        <p id="videoUploader"></p>
        <p id="videoDuration"></p>
        <img id="videoThumbnail" alt="" hidden />
      </section>
    </main>
    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
