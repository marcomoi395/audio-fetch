# Docker Compose configuration for Audio Fetch

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-fetch
    ports:
      - "8000:8000"  # Main FastAPI application
      # Port 4416 is used internally by bgutil PO Token provider
      # No need to expose externally unless debugging
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
